# Live orders are locked to this account number; any other account is rejected.
allowed_account_id = "929366227"   # "Agentic" cash account (the only one the agent may trade)

start_cash = 100000.0          # starting cash of EACH paper book
daily_loss_limit_pct = 3.0     # stop NEW buys for the day
drawdown_stop_pct = 12.0       # from peak equity: auto-pause + report
drawdown_warn_pct = 6.0        # warning only
max_position_pct = 10.0        # per stock, % of equity
max_invested_pct = 85.0        # total invested, % of equity
max_orders_per_day = 20
price_sanity_pct = 5.0         # limit price must be within this % of quote
duplicate_window_sec = 300
slippage_bps = 5.0             # paper fills
window_trading_days = 30       # evaluation window
symbol_denylist = []
db_path = "data/trader.db"

# Exactly one strategy may be "live" (real money, whole Agentic account).
# All others are "paper" (simulated, own account each).
[strategies]
momentum-quality = "live"
mean-reversion = "paper"
breakout = "paper"
trend-following = "paper"
earnings-drift = "paper"

# Per-strategy rule overrides. momentum-quality mirrors the robinhood-stock-trader skill's hard rules.
[overrides.momentum-quality]
max_position_pct = 16.0        # skill: deployable 80% / 5 slots
max_invested_pct = 80.0        # skill: 20% cash reserve always
risk_per_trade_pct = 1.0       # skill: 1% of portfolio max risk per trade (needs stop_price)
max_positions = 5
limit_only = true              # skill: never market orders
require_stop = true
require_regime = true          # skill: no buys unless today's SPY/QQQ regime is RISK-ON
one_per_sector = true
max_ai_names = 2
no_add = true                  # skill: never average down
required_phases = ["market", "fundamentals", "trend_template", "extension", "stage2", "momentum"]
confirm_days = 0               # 0 = fully automatic (user chose to skip the 2-day approval period); set to N to ask first N days after the first fill
